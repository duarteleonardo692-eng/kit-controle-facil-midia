name: Kit Controle Facil - Inventario de publicacoes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler dados do Buffer sem criar publicacoes
        run: python3 automation/buffer_inventory.py
