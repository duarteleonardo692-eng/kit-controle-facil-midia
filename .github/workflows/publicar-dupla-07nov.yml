name: Kit Controle Facil - Publicar 2 Comerciais 07 Nov Uma Vez
on:
  workflow_dispatch:
  push:
    paths:
      - 'publish_requests/dupla-2026-11-07.txt'
permissions:
  contents: write
concurrency:
  group: kit-controle-facil-2-comerciais-0711
  cancel-in-progress: false
jobs:
  publicar:
    name: Validar MP4, evitar duplicacao e publicar nas 3 redes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
      - name: Remontar os dois MP4 aprovados a partir de partes no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/heads/staging-dupla-07nov-media:refs/remotes/origin/staging-dupla-07nov-media'
          mkdir -p assets
          for i in $(seq 0 9); do
            printf -v n '%03d' "$i"
            git show "refs/remotes/origin/staging-dupla-07nov-media:staging/dupla-07nov/despesas/part${n}.b64"
          done | base64 --decode > assets/kit-controle-facil-despesas-sem-sustos-fullhd-20261107.mp4
          for i in $(seq 0 11); do
            printf -v n '%03d' "$i"
            git show "refs/remotes/origin/staging-dupla-07nov-media:staging/dupla-07nov/quanto/part${n}.b64"
          done | base64 --decode > assets/kit-controle-facil-quanto-entrou-hoje-musica-20261107.mp4
          echo '7b729821695f1f90f5d27017e42d3f811920e491d0f5f04e6632e3dea76a05db  assets/kit-controle-facil-despesas-sem-sustos-fullhd-20261107.mp4' | sha256sum -c -
          echo '064f2bbf7ccbfc8a7bcac6dd72eaa7e86b59aef777a18e4291d5afcc51050419  assets/kit-controle-facil-quanto-entrou-hoje-musica-20261107.mp4' | sha256sum -c -
      - name: Hospedar video publico no GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kit-controle-facil-despesas-sem-sustos-fullhd-20261107.mp4 assets/kit-controle-facil-quanto-entrou-hoje-musica-20261107.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Hospedar dois comerciais aprovados 07 Nov para Buffer'
            git push origin HEAD:main
          fi
      - name: Enviar ao Buffer so quando nao existir post
        run: |
          python3 -m py_compile automation/buffer_publicar_dupla_07nov.py
          python3 automation/buffer_publicar_dupla_07nov.py
