name: Kit Controle Facil - GitHub para Buffer

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem criar posts (desmarque para enviar à fila)"
        required: true
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: kit-controle-facil-buffer
  cancel-in-progress: false

jobs:
  enviar-para-buffer:
    name: Validar canais, MP4 e duplicações
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      # Ativado: publicações automáticas apenas para vídeos marcados como aprovados.
      # Uma execução manual com dry_run=true continua sendo apenas teste.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Obter vídeos aprovados
        uses: actions/checkout@v4
      - name: Validar Python e catálogo
        run: |
          python3 -m py_compile automation/buffer_publish.py
          python3 -m json.tool automation/posts.json > /dev/null
      - name: Verificar Buffer e agendar apenas vídeos sem duplicação
        run: python3 automation/buffer_publish.py
