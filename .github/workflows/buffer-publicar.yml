name: Kit Controle Facil - GitHub para Buffer

on:
  push:
    paths:
      - ".github/workflows/buffer-publicar.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem criar posts (desmarque para enviar à fila)"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: kit-controle-facil-buffer
  cancel-in-progress: false

jobs:
  enviar-para-buffer:
    name: Validar canais, MP4 e duplicações
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      # Teste seguro de credencial: execuções automáticas sempre simulam.
      # Uma execução manual com dry_run desmarcado envia à fila.
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    steps:
      - name: Obter vídeos aprovados
        uses: actions/checkout@v4
      - name: Validar Python e catálogo
        run: |
          python3 -m py_compile automation/buffer_publish.py
          python3 -m json.tool automation/posts.json > /dev/null
      - name: Consultar Buffer e simular agendamento
        run: python3 automation/buffer_publish.py
