name: Importar MP4 V4 aprovado (verificação SHA-256)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-midia-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-midia-v4
  cancel-in-progress: false

jobs:
  import-approved-video:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout com histórico atualizado
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Baixar arquivo público aprovado e validar conteúdo
        shell: bash
        env:
          VIDEO_ID: 1exluKAgG8MkXa4SdQhoYRrAt7JxB1OuL
          EXPECTED_SHA256: 3a9742920832d1e8f200b6ec6ac5403fb7ef00293a5ab8f562292eb5fbf6cdc6
          DESTINATION: reels/kit-controle-facil-v4-3a974292.mp4
        run: |
          set -euo pipefail
          mkdir -p reels
          python - <<'PY'
          import hashlib,os,urllib.request
          from pathlib import Path
          ident=os.environ["VIDEO_ID"]
          expected=os.environ["EXPECTED_SHA256"]
          url="https://drive.google.com/uc?export=download&id="+ident
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=r.read(30_000_001)
              ctype=r.headers.get("Content-Type","")
          if len(data)>30_000_000 or len(data)<100_000 or b"ftyp" not in data[:20]:
              raise SystemExit("Arquivo do Drive não foi entregue como MP4. FALHA SEGURA; nenhuma mídia publicada. MIME="+str(ctype))
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected:
              raise SystemExit("SHA-256 diferente do vídeo aprovado, cancelando sem salvar.")
          p=Path(os.environ["DESTINATION"])
          if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Arquivo existente diferente, cancelando.")
          p.write_bytes(data)
          print("Arquivo MP4 aprovado verificado:",len(data),"bytes. SHA-256:",actual)
          PY
      - name: Publicar apenas o MP4 validado no repositório de mídia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/kit-controle-facil-v4-3a974292.mp4
          if git diff --cached --quiet; then
            echo "Arquivo já está no GitHub. Nenhuma alteração."
            exit 0
          fi
          git commit -m "media: adicionar comercial V4 aprovado (SHA-256 validado)"
          git push origin HEAD:main
