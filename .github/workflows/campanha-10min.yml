name: Kit Controle Facil - Campanha 10 minutos
on:
  push:
    paths:
      - ".github/workflows/campanha-10min.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kit-controle-facil-buffer
  cancel-in-progress: false
jobs:
  campanha:
    name: Conferir campanha agendada sem novos envios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg para validar os vídeos
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validar Python e arquivo de campanha
        run: |
          python3 -m py_compile automation/buffer_campaign.py
          python3 -m json.tool automation/campanha-03nov.json > /dev/null
      - name: Conferir os 14 agendamentos sem criar duplicações
        run: python3 automation/buffer_campaign.py
      - name: Salvar IDs dos posts na proteção anti-duplicação
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/campanha-03nov-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar IDs agendados no Buffer para evitar duplicação"
            git push
          fi
