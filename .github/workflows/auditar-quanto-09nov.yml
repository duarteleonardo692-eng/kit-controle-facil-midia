name: Kit Controle Facil - Conferir entrega Quanto Final 09 Nov
on:
  push:
    paths:
      - '.github/workflows/auditar-quanto-09nov.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler status real do Buffer sem criar publicacoes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=automation python3 - <<'PY'
          import os
          from buffer_publicar_dupla_07nov import channels
          from buffer_publish import fetch_posts, is_duplicate
          from buffer_publicar_quanto_09nov import ITEM
          token=os.environ["BUFFER_API_KEY"]
          found=channels(token)
          for service in ("facebook","instagram","tiktok"):
              ch=found[service]
              posts=fetch_posts(token,ch["org_id"],ch["id"])
              matches=[p for p in posts if is_duplicate(p,ITEM)]
              if not matches:
                  print(f"RESULTADO {service}: NAO_ENCONTRADO",flush=True)
              else:
                  for p in matches:
                      print(f"RESULTADO {service}: id={p.get('id')} status={p.get('status')}",flush=True)
          PY
